name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nerdbank.GitVersioning needs the full history
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore ProcurementHTE.sln
      - run: dotnet build ProcurementHTE.sln --configuration Release --no-restore
      - run: dotnet test ProcurementHTE.sln --configuration Release --no-build
